[package]
name = "secret-injection-diff"
version = "0.1.0"
edition = "2024"
description = "Prove which processes gain secret names before a pull request merges"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-secret-injection-diff"
keywords = ["secrets", "ci", "kubernetes", "compose", "security"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "secret-injection-diff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml_ng = "0.10.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
