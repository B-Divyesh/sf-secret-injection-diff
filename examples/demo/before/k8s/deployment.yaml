apiVersion: apps/v1
kind: Deployment
metadata:
  name: seedhouse-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: example.invalid/seedhouse/api:1.4
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-runtime
                  key: database-url
          envFrom:
            - secretRef:
                name: shared-runtime
          volumeMounts:
            - name: signing-material
              mountPath: /var/run/signing
      volumes:
        - name: signing-material
          secret:
            secretName: release-signing
